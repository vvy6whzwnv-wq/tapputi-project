<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تابوتي - Tapputi Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        /* الثيمات المختلفة */
        body.theme-royal-blue { background-color: #0f172a; color: #f8fafc; }
        body.theme-dark-slate { background-color: #090d16; color: #f1f5f9; }
        body.theme-light { background-color: #f8fafc; color: #0f172a; }

        .card-theme {
            transition: all 0.3s ease;
        }
        body.theme-light .card-theme {
            background: #ffffff;
            border-color: #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .card-theme:hover {
            border-color: #3b82f6;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
        }
        body:not(.theme-light) .card-theme {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        body:not(.theme-light) .card-theme:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
        }

        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .welcome-bounce { animation: bounceSlow 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row theme-royal-blue" id="body-element">

    <!-- محتوى الشاشة الرئيسي -->
    <main class="flex-1 p-6 md:p-12 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            
            <!-- الهيدر الترحيبي -->
            <header class="text-center my-8 welcome-bounce">
                <span id="badge-text" class="inline-block px-3 py-1 text-xs font-semibold tracking-wider text-blue-400 bg-blue-950/60 border border-blue-800/50 rounded-full mb-3">
                    منصة تابوتي الذكية
                </span>
                <h1 id="welcome-title" class="text-3xl md:text-5xl font-extrabold tracking-tight text-blue-500 mb-3">
                    مرحبًا بكم في منصة تابوتي!
                </h1>
                <p id="welcome-desc" class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
                    العناية المبنية على المشكلة والموجهة بأحدث المعايير العلمية.
                </p>
            </header>

            <!-- منطقة العرض الديناميكية -->
            <div id="dynamic-content"></div>

        </div>
    </main>

    <!-- الشريط الجانبي على اليسار -->
    <aside id="sidebar-element" class="w-full md:w-72 bg-slate-900 border-t md:border-t-0 md:border-r border-slate-800 p-6 flex flex-col justify-between shrink-0 order-first md:order-last">
        <div>
            <div class="flex items-center gap-3 mb-8 pb-4 border-b border-slate-800">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white text-lg shadow-lg shadow-blue-500/30">
                    T
                </div>
                <div>
                    <h2 id="sidebar-title" class="font-bold text-slate-100 text-base">منصة تابوتي</h2>
                    <p class="text-xs text-blue-400">Tapputi Platform</p>
                </div>
            </div>

            <!-- أزرار التنقل الرئيسية -->
            <nav class="space-y-2">
                <button onclick="switchView('categories')" id="nav-categories" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition bg-blue-600 text-white shadow-lg shadow-blue-600/25 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-16zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-16z"/></svg>
                    <span data-i18n="nav_categories">الواجهة والأقسام</span>
                </button>

                <button onclick="switchView('chat')" id="nav-chat" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-slate-200 cursor-pointer">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                    <span data-i18n="nav_chat">Chat Tapputi</span>
                </button>

                <button onclick="switchView('about')" id="nav-about" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-slate-200 cursor-pointer">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span data-i18n="nav_about">من نحن</span>
                </button>

                <button onclick="switchView('lang')" id="nav-lang" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-slate-200 cursor-pointer">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
                    <span data-i18n="nav_lang">تعديل اللغة</span>
                </button>

                <button onclick="switchView('theme')" id="nav-theme" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-slate-200 cursor-pointer">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 73.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"/></svg>
                    <span data-i18n="nav_theme">تعديل الثيمات</span>
                </button>
            </nav>
        </div>

        <div class="pt-6 border-t border-slate-800 text-xs text-slate-500 text-center">
            Tapputi Platform © 2026
        </div>
    </aside>

    <script>
        // إعدادات اللغة والثيمات الحالية
        let currentLang = 'ar';
        let currentTheme = 'theme-royal-blue';
        let currentView = 'categories';

        const translations = {
            ar: {
                badge: "منصة تابوتي الذكية",
                title: "مرحبًا بكم في منصة تابوتي!",
                desc: "العناية المبنية على المشكلة والموجهة بأحدث المعايير العلمية.",
                nav_categories: "الواجهة والأقسام",
                nav_chat: "Chat Tapputi",
                nav_about: "من نحن",
                nav_lang: "تعديل اللغة",
                nav_theme: "تعديل الثيمات",
                sections_title: "التصنيفات العلمية والأقسام",
                explore: "استكشف المحتوى ←",
                empty: "القسم فارغ حالياً",
                back: "← العودة للأقسام الرئيسية",
                chat_title: "Chat Tapputi",
                chat_badge: "قيد الإنشاء",
                chat_desc: "نموذج الذكاء الاصطناعي اللغوي الخاص بمنصة تابوتي قيد التطوير والتدريب لتقديم استشارات علمية دقيقة مستقبلاً.",
                about_title: "من نحن",
                about_subtitle: "فريق العمل المطور لمشروع منصة تابوتي",
                about_desc: "نعمل على تقديم منصة ذكية ومتقدمة تعتمد على مبدأ العناية الموجهة والمبنية على المشكلة لتوفير أرقى الحلول العلمية.",
                team_title: "أعضاء الفريق:",
                lang_title: "إعدادات اللغة / Language Settings",
                lang_desc: "اختر لغة العرض المفضلة لديك للتطبيق:",
                theme_title: "إعدادات الثيمات / Theme Customizer",
                theme_desc: "اختر المظهر البصري المناسب لتجربتك:",
                theme_1: "أزرق ملكي (Royal Blue)",
                theme_2: "داكن عميق (Dark Slate)",
                theme_3: "فاتح نقي (Light Mode)",
                apply: "تطبيق التغييرات"
            },
            en: {
                badge: "Smart Tapputi Platform",
                title: "Welcome to Tapputi Platform!",
                desc: "Problem-based care guided by the latest scientific standards.",
                nav_categories: "Interface & Categories",
                nav_chat: "Chat Tapputi",
                nav_about: "About Us",
                nav_lang: "Change Language",
                nav_theme: "Theme Customizer",
                sections_title: "Scientific Categories",
                explore: "Explore Content →",
                empty: "Category is currently empty",
                back: "← Back to Main Categories",
                chat_title: "Chat Tapputi",
                chat_badge: "Under Construction",
                chat_desc: "Tapputi's linguistic AI model is currently under development to provide accurate scientific consultations in the future.",
                about_title: "About Us",
                about_subtitle: "Development team of Tapputi Platform",
                about_desc: "We strive to provide a smart, advanced platform based on problem-oriented care to offer top scientific solutions.",
                team_title: "Team Members:",
                lang_title: "Language Settings",
                lang_desc: "Choose your preferred display language:",
                theme_title: "Theme Customizer",
                theme_desc: "Choose the visual appearance for your experience:",
                theme_1: "Royal Blue",
                theme_2: "Dark Slate",
                theme_3: "Light Mode",
                apply: "Apply Changes"
            }
        };

        function t(key) {
            return translations[currentLang][key] || key;
        }

        function updateStaticTexts() {
            document.getElementById('badge-text').innerText = t('badge');
            document.getElementById('welcome-title').innerText = t('title');
            document.getElementById('welcome-desc').innerText = t('desc');
            
            // تحديث النصوص في الشريط الجانبي
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                el.innerText = t(k);
            });

            // تحديث اتجاه الصفحة بناءً على اللغة
            const root = document.getElementById('html-root');
            if (currentLang === 'ar') {
                root.setAttribute('dir', 'rtl');
                root.setAttribute('lang', 'ar');
            } else {
                root.setAttribute('dir', 'ltr');
                root.setAttribute('lang', 'en');
            }
        }

        function switchView(viewName) {
            currentView = viewName;
            ['categories', 'chat', 'about', 'lang', 'theme'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if (v === viewName) {
                    btn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition bg-blue-600 text-white shadow-lg shadow-blue-600/25 cursor-pointer";
                } else {
                    btn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition text-slate-400 hover:bg-slate-800 hover:text-slate-200 cursor-pointer";
                }
            });

            if (viewName === 'categories') loadCategoriesView();
            else if (viewName === 'chat') loadChatView();
            else if (viewName === 'about') loadAboutView();
            else if (viewName === 'lang') loadLangView();
            else if (viewName === 'theme') loadThemeView();
        }

        // 1. عرض الأقسام
        async function loadCategoriesView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="flex items-center justify-between mb-6 border-b border-slate-700/50 pb-3">
                    <h2 class="text-xl font-bold flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        ${t('sections_title')}
                    </h2>
                </div>
                <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <p class="text-slate-400 col-span-full">Loading...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/categories');
                const data = await response.json();
                const grid = document.getElementById('categories-grid');
                grid.innerHTML = '';

                const categories = data.categories || [];
                if (categories.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center py-8">${t('empty')}</p>`;
                    return;
                }

                categories.forEach(cat => {
                    const card = document.createElement('div');
                    card.className = "card-theme p-6 rounded-2xl cursor-pointer flex flex-col justify-between group";
                    card.onclick = () => openCategoryDetail(cat);
                    
                    const name = currentLang === 'ar' ? cat.name_ar : cat.name_en;
                    const desc = currentLang === 'ar' ? cat.desc_ar : cat.desc_en;

                    card.innerHTML = `
                        <div>
                            <h3 class="text-lg font-bold mb-2 group-hover:text-blue-500 transition">${name}</h3>
                            <p class="text-sm text-slate-400 leading-relaxed mb-4">${desc}</p>
                        </div>
                        <div class="flex items-center text-xs font-semibold text-blue-500">
                            ${t('explore')}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('categories-grid').innerHTML = '<p class="text-red-400 col-span-full">Failed to connect to backend server.</p>';
            }
        }

        function openCategoryDetail(cat) {
            const name = currentLang === 'ar' ? cat.name_ar : cat.name_en;
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <button onclick="switchView('categories')" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-blue-500 bg-slate-800/50 hover:bg-slate-800 px-4 py-2 rounded-xl border border-slate-700/50 transition cursor-pointer">
                    ${t('back')}
                </button>
                <div class="card-theme p-8 rounded-2xl">
                    <h2 class="text-2xl font-bold mb-2">${name}</h2>
                    <div class="text-center py-16 border-2 border-dashed border-slate-700/60 rounded-xl bg-slate-900/20 mt-4">
                        <p class="text-slate-400 font-medium text-base">${t('empty')}</p>
                    </div>
                </div>
            `;
        }

        // 2. شات تابوتي
        function loadChatView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="card-theme p-10 rounded-2xl text-center max-w-xl mx-auto mt-6">
                    <div class="w-16 h-16 mx-auto mb-4 bg-blue-950/60 border border-blue-800/50 rounded-2xl flex items-center justify-center text-blue-400">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">${t('chat_title')}</h2>
                    <span class="inline-block px-3 py-1 text-xs font-semibold text-amber-400 bg-amber-950/60 border border-amber-800/50 rounded-full mb-4">
                        ${t('chat_badge')}
                    </span>
                    <p class="text-slate-400 text-sm leading-relaxed">
                        ${t('chat_desc')}
                    </p>
                </div>
            `;
        }

        // 3. من نحن (تمت إضافة مجتبى حسنين صاحب هنا)
        function loadAboutView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="card-theme p-8 rounded-2xl max-w-2xl mx-auto mt-6">
                    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-700/50">
                        <div class="p-3 bg-blue-950/50 border border-blue-800/40 rounded-xl text-blue-400">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold">${t('about_title')}</h2>
                            <p class="text-xs text-slate-400">${t('about_subtitle')}</p>
                        </div>
                    </div>
                    
                    <p class="text-slate-300 text-sm mb-6 leading-relaxed">
                        ${t('about_desc')}
                    </p>

                    <h3 class="text-sm font-bold text-blue-500 mb-3 uppercase tracking-wider">${t('team_title')}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> محمد حسين ضاحي
                        </div>
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> مجتبى حسنين صاحب
                        </div>
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> حسن هادي كاظم
                        </div>
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> حسن عبد علي خلف
                        </div>
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> علي أحمد
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. قسم تعديل اللغة
        function loadLangView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="card-theme p-8 rounded-2xl max-w-xl mx-auto mt-6">
                    <h2 class="text-2xl font-bold mb-2">${t('lang_title')}</h2>
                    <p class="text-slate-400 text-sm mb-6">${t('lang_desc')}</p>
                    
                    <div class="space-y-3 mb-6">
                        <label class="flex items-center gap-3 p-4 rounded-xl card-theme cursor-pointer">
                            <input type="radio" name="lang-select" value="ar" ${currentLang === 'ar' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                            <span class="font-semibold">العربية (Arabic)</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 rounded-xl card-theme cursor-pointer">
                            <input type="radio" name="lang-select" value="en" ${currentLang === 'en' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                            <span class="font-semibold">English (الإنجليزية)</span>
                        </label>
                    </div>
                    
                    <button onclick="applyLanguage()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition cursor-pointer shadow-lg shadow-blue-600/30">
                        ${t('apply')}
                    </button>
                </div>
            `;
        }

        function applyLanguage() {
            const selected = document.querySelector('input[name="lang-select"]:checked');
            if (selected) {
                currentLang = selected.value;
                updateStaticTexts();
                switchView(currentView);
            }
        }

        // 5. قسم تعديل الثيمات
        function loadThemeView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="card-theme p-8 rounded-2xl max-w-xl mx-auto mt-6">
                    <h2 class="text-2xl font-bold mb-2">${t('theme_title')}</h2>
                    <p class="text-slate-400 text-sm mb-6">${t('theme_desc')}</p>
                    
                    <div class="space-y-3 mb-6">
                        <label class="flex items-center gap-3 p-4 rounded-xl card-theme cursor-pointer">
                            <input type="radio" name="theme-select" value="theme-royal-blue" ${currentTheme === 'theme-royal-blue' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                            <span class="font-semibold">${t('theme_1')}</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 rounded-xl card-theme cursor-pointer">
                            <input type="radio" name="theme-select" value="theme-dark-slate" ${currentTheme === 'theme-dark-slate' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                            <span class="font-semibold">${t('theme_2')}</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 rounded-xl card-theme cursor-pointer">
                            <input type="radio" name="theme-select" value="theme-light" ${currentTheme === 'theme-light' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                            <span class="font-semibold">${t('theme_3')}</span>
                        </label>
                    </div>
                    
                    <button onclick="applyTheme()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition cursor-pointer shadow-lg shadow-blue-600/30">
                        ${t('apply')}
                    </button>
                </div>
            `;
        }

        function applyTheme() {
            const selected = document.querySelector('input[name="theme-select"]:checked');
            if (selected) {
                currentTheme = selected.value;
                const body = document.getElementById('body-element');
                body.className = `min-h-screen flex flex-col md:flex-row ${currentTheme}`;
                
                // تحديث لون الشريط الجانبي بناءً على الثيم
                const sidebar = document.getElementById('sidebar-element');
                if (currentTheme === 'theme-light') {
                    sidebar.className = "w-full md:w-72 bg-white border-t md:border-t-0 md:border-r border-slate-200 p-6 flex flex-col justify-between shrink-0 order-first md:order-last text-slate-800";
                } else if (currentTheme === 'theme-dark-slate') {
                    sidebar.className = "w-full md:w-72 bg-[#05070c] border-t md:border-t-0 md:border-r border-slate-900 p-6 flex flex-col justify-between shrink-0 order-first md:order-last";
                } else {
                    sidebar.className = "w-full md:w-72 bg-slate-900 border-t md:border-t-0 md:border-r border-slate-800 p-6 flex flex-col justify-between shrink-0 order-first md:order-last";
                }
            }
        }

        // البدء بالواجهة الافتراضية
        updateStaticTexts();
        loadCategoriesView();
    </script>
</body>
</html>
