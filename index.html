<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تابوتي - Tapputi Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        /* الثيمات المختلفة */
        body.theme-royal-blue { background-color: #0f172a; color: #f8fafc; }
        body.theme-dark-slate { background-color: #090d16; color: #f1f5f9; }
        body.theme-light { background-color: #f8fafc; color: #0f172a; }

        .card-theme {
            transition: all 0.3s ease;
        }
        body.theme-light .card-theme {
            background: #ffffff;
            border-color: #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .card-theme:hover {
            border-color: #3b82f6;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
        }
        body:not(.theme-light) .card-theme {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        body:not(.theme-light) .card-theme:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
        }

        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .welcome-bounce { animation: bounceSlow 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col theme-royal-blue pb-24 md:pb-0 md:pt-20" id="body-element">

    <!-- الهيدر العلوي (متوافق مع الدسكتوب والتابلت والموبايل كشريط علوي) -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 flex items-center justify-between z-50">
        <!-- الشعار / الرئيسية -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('categories')">
            <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white text-base shadow-lg shadow-blue-500/30">
                T
            </div>
            <span class="font-bold text-sm md:text-base text-slate-100">منصة تابوتي</span>
        </div>

        <!-- الأيقونات العلوية (عربة التسوق، الإعدادات، وعلامة السؤال "من نحن") -->
        <div class="flex items-center gap-2">
            <!-- عربة التسوق في الدسكتوب -->
            <button onclick="switchView('cart')" id="nav-desktop-cart" class="p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer relative" title="عربة التسوق">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span class="absolute top-1 right-1 bg-blue-600 text-white text-[9px] w-3.5 h-3.5 rounded-full flex items-center justify-center">0</span>
            </button>

            <!-- زر الإعدادات -->
            <button onclick="switchView('settings')" id="nav-settings" class="p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer" title="الإعدادات">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>

            <!-- علامة السؤال (من نحن) -->
            <button onclick="switchView('about')" id="nav-about" class="p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer" title="من نحن">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </button>
        </div>
    </header>

    <!-- محتوى الشاشة الرئيسي -->
    <main class="flex-1 p-6 md:p-12 overflow-y-auto mt-16">
        <div class="max-w-4xl mx-auto">
            
            <!-- الهيدر الترحيبي -->
            <header class="text-center my-8 welcome-bounce">
                <span id="badge-text" class="inline-block px-3 py-1 text-xs font-semibold tracking-wider text-blue-400 bg-blue-950/60 border border-blue-800/50 rounded-full mb-3">
                    منصة تابوتي الذكية
                </span>
                <h1 id="welcome-title" class="text-3xl md:text-5xl font-extrabold tracking-tight text-blue-500 mb-3">
                    مرحبًا بكم في منصة تابوتي!
                </h1>
                <p id="welcome-desc" class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
                    العناية المبنية على المشكلة والموجهة بأحدث المعايير العلمية.
                </p>
            </header>

            <!-- منطقة العرض الديناميكية -->
            <div id="dynamic-content"></div>

        </div>
    </main>

    <!-- الشريط السفلي للموبايل فقط (يظهر على الموبايل md:hidden ويختفي على الدسكتوب) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around items-center py-2 px-4 z-50 shadow-2xl backdrop-blur-md bg-opacity-95">
        <!-- الرئيسية -->
        <button onclick="switchView('categories')" id="mob-nav-categories" class="flex flex-col items-center justify-center p-2 text-blue-500 text-xs font-semibold transition cursor-pointer">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span data-i18n="nav_home">الرئيسية</span>
        </button>

        <!-- عربة التسوق للموبايل -->
        <button onclick="switchView('cart')" id="mob-nav-cart" class="flex flex-col items-center justify-center p-2 text-slate-400 hover:text-slate-200 text-xs font-semibold transition cursor-pointer relative">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            <span data-i18n="nav_cart">عربة التسوق</span>
            <span class="absolute top-1 right-3 bg-blue-600 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>

        <!-- Chat Tapputi -->
        <button onclick="switchView('chat')" id="mob-nav-chat" class="flex flex-col items-center justify-center p-2 text-slate-400 hover:text-slate-200 text-xs font-semibold transition cursor-pointer">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
            <span data-i18n="nav_chat">Chat Tapputi</span>
        </button>
    </nav>

    <script>
        let currentLang = 'ar';
        let currentTheme = 'theme-royal-blue';
        let currentView = 'categories';

        const translations = {
            ar: {
                badge: "منصة تابوتي الذكية",
                title: "مرحبًا بكم في منصة تابوتي!",
                desc: "العناية المبنية على المشكلة والموجهة بأحدث المعايير العلمية.",
                nav_home: "الرئيسية",
                nav_cart: "عربة التسوق",
                nav_chat: "Chat Tapputi",
                sections_title: "التصنيفات العلمية والأقسام",
                explore: "استكشف المحتوى ←",
                empty: "القسم فارغ حالياً",
                back: "← العودة للأقسام الرئيسية",
                chat_title: "Chat Tapputi",
                chat_badge: "قيد الإنشاء",
                chat_desc: "نموذج الذكاء الاصطناعي اللغوي الخاص بمنصة تابوتي قيد التطوير والتدريب لتقديم استشارات علمية دقيقة مستقبلاً.",
                about_title: "من نحن (About Us)",
                about_subtitle: "فريق العمل المطور لمشروع منصة تابوتي",
                about_desc: "نعمل على تقديم منصة ذكية ومتقدمة تعتمد على مبدأ العناية الموجهة والمبنية على المشكلة لتوفير أرقى الحلول العلمية.",
                team_title: "أعضاء الفريق:",
                settings_title: "إعدادات التطبيق والتفضيلات",
                settings_desc: "تحكم في مظاهر الثيمات، لغة العرض، ومعلومات الإصدار الحالي.",
                lang_label: "لغة العرض (Language)",
                theme_label: "مظهر الثيم (Theme)",
                version_label: "رقم الإصدار (App Version):",
                version_val: "v1.2.4 (2026)",
                theme_1: "أزرق ملكي (Royal Blue)",
                theme_2: "داكن عميق (Dark Slate)",
                theme_3: "فاتح نقي (Light Mode)",
                cart_title: "عربة التسوق",
                cart_empty: "عربة التسوق فارغة حالياً.",
                apply: "حفظ التغييرات"
            },
            en: {
                badge: "Smart Tapputi Platform",
                title: "Welcome to Tapputi Platform!",
                desc: "Problem-based care guided by the latest scientific standards.",
                nav_home: "Home",
                nav_cart: "Cart",
                nav_chat: "Chat Tapputi",
                sections_title: "Scientific Categories",
                explore: "Explore Content →",
                empty: "Category is currently empty",
                back: "← Back to Main Categories",
                chat_title: "Chat Tapputi",
                chat_badge: "Under Construction",
                chat_desc: "Tapputi's linguistic AI model is currently under development to provide accurate scientific consultations in the future.",
                about_title: "About Us",
                about_subtitle: "Development team of Tapputi Platform",
                about_desc: "We strive to provide a smart, advanced platform based on problem-oriented care to offer top scientific solutions.",
                team_title: "Team Members:",
                settings_title: "App Settings & Preferences",
                settings_desc: "Control theme appearance, display language, and current version info.",
                lang_label: "Display Language",
                theme_label: "Theme Appearance",
                version_label: "App Version:",
                version_val: "v1.2.4 (2026)",
                theme_1: "Royal Blue",
                theme_2: "Dark Slate",
                theme_3: "Light Mode",
                cart_title: "Shopping Cart",
                cart_empty: "Your shopping cart is currently empty.",
                apply: "Save Changes"
            }
        };

        function t(key) {
            return translations[currentLang][key] || key;
        }

        function updateStaticTexts() {
            document.getElementById('badge-text').innerText = t('badge');
            document.getElementById('welcome-title').innerText = t('title');
            document.getElementById('welcome-desc').innerText = t('desc');
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                el.innerText = t(k);
            });

            const root = document.getElementById('html-root');
            if (currentLang === 'ar') {
                root.setAttribute('dir', 'rtl');
                root.setAttribute('lang', 'ar');
            } else {
                root.setAttribute('dir', 'ltr');
                root.setAttribute('lang', 'en');
            }
        }

        function switchView(viewName) {
            currentView = viewName;
            
            // تفعيل وتلوين أزرار الشريط السفلي للموبايل
            ['categories', 'cart', 'chat'].forEach(v => {
                const mobBtn = document.getElementById(`mob-nav-${v}`);
                if (mobBtn) {
                    if (v === viewName) {
                        mobBtn.className = "flex flex-col items-center justify-center p-2 text-blue-500 text-xs font-semibold transition cursor-pointer";
                    } else {
                        mobBtn.className = "flex flex-col items-center justify-center p-2 text-slate-400 hover:text-slate-200 text-xs font-semibold transition cursor-pointer";
                    }
                }
            });

            // تفعيل وتلوين أزرار الهيدر العلوي للدسكتوب (العربة، الإعدادات، من نحن)
            const desktopCartBtn = document.getElementById('nav-desktop-cart');
            const settingsBtn = document.getElementById('nav-settings');
            const aboutBtn = document.getElementById('nav-about');
            
            if (desktopCartBtn && settingsBtn && aboutBtn) {
                desktopCartBtn.className = viewName === 'cart' ? "p-2.5 rounded-xl text-white bg-slate-800 transition cursor-pointer relative" : "p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer relative";
                settingsBtn.className = viewName === 'settings' ? "p-2.5 rounded-xl text-white bg-slate-800 transition cursor-pointer" : "p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer";
                aboutBtn.className = viewName === 'about' ? "p-2.5 rounded-xl text-white bg-slate-800 transition cursor-pointer" : "p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer";
            }

            if (viewName === 'categories') loadCategoriesView();
            else if (viewName === 'cart') loadCartView();
            else if (viewName === 'chat') loadChatView();
            else if (viewName === 'about') loadAboutView();
            else if (viewName === 'settings') loadSettingsView();
        }

        async function loadCategoriesView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="flex items-center justify-between mb-6 border-b border-slate-700/50 pb-3">
                    <h2 class="text-xl font-bold flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        ${t('sections_title')}
                    </h2>
                </div>
                <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <p class="text-slate-400 col-span-full">Loading...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/categories');
                const data = await response.json();
                const grid = document.getElementById('categories-grid');
                grid.innerHTML = '';

                const categories = data.categories || [];
                if (categories.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center py-8">${t('empty')}</p>`;
                    return;
                }

                categories.forEach(cat => {
                    const card = document.createElement('div');
                    card.className = "card-theme p-6 rounded-2xl cursor-pointer flex flex-col justify-between group";
                    card.onclick = () => openCategoryDetail(cat);
                    
                    const name = currentLang === 'ar' ? cat.name_ar : cat.name_en;
                    const desc = currentLang === 'ar' ? cat.desc_ar : cat.desc_en;

                    card.innerHTML = `
                        <div>
                            <h3 class="text-lg font-bold mb-2 group-hover:text-blue-500 transition">${name}</h3>
                            <p class="text-sm text-slate-400 leading-relaxed mb-4">${desc}</p>
                        </div>
                        <div class="flex items-center text-xs font-semibold text-blue-500">
                            ${t('explore')}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('categories-grid').innerHTML = '<p class="text-red-400 col-span-full">Failed to connect to backend server.</p>';
            }
        }

        function openCategoryDetail(cat) {
            const name = currentLang === 'ar' ? cat.name_ar : cat.name_en;
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <button onclick="switchView('categories')" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-blue-500 bg-slate-800/50 hover:bg-slate-800 px-4 py-2 rounded-xl border border-slate-700/50 transition cursor-pointer">
                    ${t('back')}
                </button>
                <div class="card-theme p-8 rounded-2xl">
                    <h2 class="text-2xl font-bold mb-2">${name}</h2>
                    <div class="text-center py-16 border-2 border-dashed border-slate-700/60 rounded-xl bg-slate-900/20 mt-4">
                        <p class="text-slate-400 font-medium text-base">${t('empty')}</p>
                    </div>
                </div>
            `;
        }

        function loadCartView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="card-theme p-8 rounded-2xl max-w-xl mx-auto mt-6 text-center">
                    <div class="w-16 h-16 mx-auto mb-4 bg-blue-950/60 border border-blue-800/50 rounded-2xl flex items-center justify-center text-blue-400">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">${t('cart_title')}</h2>
                    <p class="text-slate-400 text-sm mb-6">${t('cart_empty')}</p>
                </div>
            `;
        }

        function loadChatView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="card-theme p-10 rounded-2xl text-center max-w-xl mx-auto mt-6">
                    <div class="w-16 h-16 mx-auto mb-4 bg-blue-950/60 border border-blue-800/50 rounded-2xl flex items-center justify-center text-blue-400">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">${t('chat_title')}</h2>
                    <span class="inline-block px-3 py-1 text-xs font-semibold text-amber-400 bg-amber-950/60 border border-amber-800/50 rounded-full mb-4">
                        ${t('chat_badge')}
                    </span>
                    <p class="text-slate-400 text-sm leading-relaxed">
                        ${t('chat_desc')}
                    </p>
                </div>
            `;
        }

        function loadAboutView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="card-theme p-8 rounded-2xl max-w-2xl mx-auto mt-6">
                    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-700/50">
                        <div class="p-3 bg-blue-950/50 border border-blue-800/40 rounded-xl text-blue-400">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold">${t('about_title')}</h2>
                            <p class="text-xs text-slate-400">${t('about_subtitle')}</p>
                        </div>
                    </div>
                    
                    <p class="text-slate-300 text-sm mb-6 leading-relaxed">
                        ${t('about_desc')}
                    </p>

                    <h3 class="text-sm font-bold text-blue-500 mb-3 uppercase tracking-wider">${t('team_title')}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> محمد حسين ضاحي
                        </div>
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> مجتبى حسنين صاحب
                        </div>
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> حسن هادي كاظم
                        </div>
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> حسن عبد علي خلف
                        </div>
                        <div class="card-theme p-4 rounded-xl font-semibold flex items-center gap-3">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> علي أحمد
                        </div>
                    </div>
                </div>
            `;
        }

        function loadSettingsView() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = `
                <div class="card-theme p-8 rounded-2xl max-w-xl mx-auto mt-6">
                    <h2 class="text-2xl font-bold mb-2">${t('settings_title')}</h2>
                    <p class="text-slate-400 text-sm mb-6">${t('settings_desc')}</p>
                    
                    <!-- إعدادات اللغة -->
                    <div class="mb-6 pb-6 border-b border-slate-700/50">
                        <label class="block text-sm font-semibold mb-3 text-blue-400">${t('lang_label')}</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-3 p-3 rounded-xl card-theme cursor-pointer">
                                <input type="radio" name="lang-select" value="ar" ${currentLang === 'ar' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                                <span class="font-semibold text-sm">العربية (Arabic)</span>
                            </label>
                            <label class="flex items-center gap-3 p-3 rounded-xl card-theme cursor-pointer">
                                <input type="radio" name="lang-select" value="en" ${currentLang === 'en' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                                <span class="font-semibold text-sm">English (الإنجليزية)</span>
                            </label>
                        </div>
                    </div>

                    <!-- إعدادات الثيمات -->
                    <div class="mb-6 pb-6 border-b border-slate-700/50">
                        <label class="block text-sm font-semibold mb-3 text-blue-400">${t('theme_label')}</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-3 p-3 rounded-xl card-theme cursor-pointer">
                                <input type="radio" name="theme-select" value="theme-royal-blue" ${currentTheme === 'theme-royal-blue' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                                <span class="font-semibold text-sm">${t('theme_1')}</span>
                            </label>
                            <label class="flex items-center gap-3 p-3 rounded-xl card-theme cursor-pointer">
                                <input type="radio" name="theme-select" value="theme-dark-slate" ${currentTheme === 'theme-dark-slate' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                                <span class="font-semibold text-sm">${t('theme_2')}</span>
                            </label>
                            <label class="flex items-center gap-3 p-3 rounded-xl card-theme cursor-pointer">
                                <input type="radio" name="theme-select" value="theme-light" ${currentTheme === 'theme-light' ? 'checked' : ''} class="w-4 h-4 text-blue-600">
                                <span class="font-semibold text-sm">${t('theme_3')}</span>
                            </label>
                        </div>
                    </div>

                    <!-- رقم الإصدار -->
                    <div class="mb-6 flex items-center justify-between p-3 rounded-xl bg-slate-900/30 border border-slate-700/40 text-sm">
                        <span class="text-slate-400">${t('version_label')}</span>
                        <span class="font-bold text-blue-400">${t('version_val')}</span>
                    </div>
                    
                    <button onclick="applySettings()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition cursor-pointer shadow-lg shadow-blue-600/30">
                        ${t('apply')}
                    </button>
                </div>
            `;
        }

        function applySettings() {
            const selectedLang = document.querySelector('input[name="lang-select"]:checked');
            if (selectedLang) {
                currentLang = selectedLang.value;
            }

            const selectedTheme = document.querySelector('input[name="theme-select"]:checked');
            if (selectedTheme) {
                currentTheme = selectedTheme.value;
                const body = document.getElementById('body-element');
                body.className = `min-h-screen flex flex-col ${currentTheme} pb-24 md:pb-0 md:pt-20`;
            }

            updateStaticTexts();
            switchView(currentView);
        }

        updateStaticTexts();
        loadCategoriesView();
    </script>
</body>
</html>
